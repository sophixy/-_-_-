<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Опрос</title>
<style>
  :root { --bg: #F3F8FF; --fg: #1C2433; --muted: #5A6478; --accent: #1E6BD6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0D131F; --fg: #E6EBF3; --muted: #98A3B8; --accent: #5AA9F5; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
         background: var(--bg); color: var(--fg); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; padding-inline: 16px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 16px; line-height: 1.5; margin: 0; max-width: 34ch; }
  a { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Открываем опрос</h1>
  <p id="msg">Это займет пару секунд.</p>
  <noscript><p>Чтобы пройти опрос, включите JavaScript в браузере и откройте ссылку еще раз.</p></noscript>
</main>
<script>
/* Распределитель: каждый участник с равной вероятностью попадает в одну из трех форм.
   Выбор запоминается в браузере, поэтому при повторном открытии ссылки человек вернется в ту же форму.
   Для проверки: открыть ссылку с #reset на конце, чтобы выбрать форму заново. */
(function () {
  var FORMS = [
    'https://forms.yandex.ru/u/6ad622a06d2d738ce4a5a721/',
    'https://forms.yandex.ru/u/6ad648bb4a052d82f0ebc282/',
    'https://forms.yandex.ru/u/6ad648ddc45c074b513c7cf4/'
  ];
  var KEY = 'opros-forma';

  function draw(n) {                       // равновероятное число от 0 до n-1
    var c = window.crypto || window.msCrypto;
    if (!c || !c.getRandomValues) return Math.floor(Math.random() * n);
    var r = new Uint32Array(1), limit = Math.floor(4294967296 / n) * n;
    do { c.getRandomValues(r); } while (r[0] >= limit);
    return r[0] % n;
  }

  var i = null;
  try {
    if (location.hash === '#reset') localStorage.removeItem(KEY);
    var saved = localStorage.getItem(KEY);
    if (saved !== null && FORMS[+saved]) i = +saved;
  } catch (e) {}
  if (i === null) {
    i = draw(FORMS.length);
    try { localStorage.setItem(KEY, String(i)); } catch (e) {}
  }

  var url = FORMS[i] + (location.search || '');   // параметры из ссылки (если панель их передает) идут дальше в форму
  setTimeout(function () {
    document.getElementById('msg').innerHTML = 'Если опрос не открылся, <a href="' + url + '">нажмите здесь</a>.';
  }, 3000);
  location.replace(url);
})();
</script>
</body>
</html>
