<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Корзинка</title>
<style>
  :root{--bg:#F3F8FF;--fg:#1C2433;--muted:#5A6478}
  @media (prefers-color-scheme: dark){:root{--bg:#0D131F;--fg:#E6EBF3;--muted:#98A3B8}}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;padding-inline:16px;text-align:center}
  h1{font-size:28px;margin:0 0 8px}
  p{color:var(--muted);font-size:16px;line-height:1.5;margin:0;max-width:34ch}
</style>
</head>
<body>
  <main>
    <h1>Корзинка</h1>
    <p>Откройте ссылку, которую вам прислали для участия в исследовании.</p>
  </main>
</body>
</html>
