<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Корзинка</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Корзинка">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F8FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: one phone centred on a quiet ground; each experimental version is its own file with no switcher.
   Page colors follow the viewer's theme; the app inside the phone is the stimulus and stays in its own light palette. */
:root{
  --page-bg:#ECEFF4; --page-fg:#1C2433; --page-muted:#5A6478; --panel:#FFFFFF; --panel-line:#D6DCE7;
  --accent:#1E6BD6; --accent-fg:#FFFFFF; --accent-soft:#E1EEFC; --focus:#F39A57;
  --font-ui:'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  /* app (stimulus) palette, fixed in both themes */
  --brand:#1E6BD6; --brand-d:#1553B0; --brand-dd:#0E3F8A; --brand-l:#E1EEFC;
  --peach:#FFB37A; --peach-d:#F39A57; --peach-l:#FFE9D6;
  --cream:#F3F8FF; --ink:#2B2B2B; --muted:#6B7385; --line:#E2EAF5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page-bg:#0D131F; --page-fg:#E6EBF3; --page-muted:#98A3B8; --panel:#161E2C; --panel-line:#2A3547;
    --accent:#5AA9F5; --accent-fg:#071A33; --accent-soft:#172A45; --focus:#FFB37A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page-bg:#0D131F; --page-fg:#E6EBF3; --page-muted:#98A3B8; --panel:#161E2C; --panel-line:#2A3547;
  --accent:#5AA9F5; --accent-fg:#071A33; --accent-soft:#172A45; --focus:#FFB37A; color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--page-bg);color:var(--page-fg);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
.page{box-sizing:border-box;min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding-inline:16px;padding-block:16px}
.phone-wrap{flex:none}
:where(.phone,.phone *,.phone *::before,.phone *::after){box-sizing:border-box}
:where(.phone *){margin:0;padding:0}

/* ---------- phone frame ---------- */
.phone{zoom:1.42;position:relative;width:414px;height:868px;border-radius:64px;padding:12px;
  background:linear-gradient(150deg,#3A3E44 0%,#16181B 45%,#24272B 100%);
  box-shadow:0 0 0 1.5px #4A4F56 inset,0 2px 0 0 #5A5F66 inset,0 34px 60px -18px rgba(40,50,50,.38),0 12px 28px rgba(40,50,50,.12)}
.phone:before,.phone:after{content:"";position:absolute;background:#2A2D31;border-radius:2px}
.phone:before{left:-3px;top:180px;width:3px;height:64px;box-shadow:0 84px 0 #2A2D31}
.phone:after{right:-3px;top:220px;width:3px;height:96px}
.screen{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:var(--cream)}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#0B0B0C;z-index:50}
.status{height:52px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font-weight:700;font-size:16px;position:relative;z-index:40}
.status .ic{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:#1A1A1A;z-index:60}

/* ---------- shared ---------- */
.nav{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.nav .t{font-size:17px;font-weight:800;letter-spacing:-.1px}
.cbtn{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(20,55,130,.08)}
.btn{height:58px;border-radius:19px;background:linear-gradient(180deg,#3A8BEA 0%,var(--brand) 55%,#1A5DC2 100%);color:#fff;font-weight:800;font-size:18px;
  display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 22px -8px rgba(25,85,190,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px;margin-bottom:12px}
.sec-h b{font-size:20px;font-weight:800;letter-spacing:-.2px}
.sec-h span{font-size:15px;font-weight:700;color:var(--brand)}
svg{display:block}

/* ---------- screen 1 ---------- */
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 20px 0}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#3BA4F2,var(--brand-d));display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px -4px rgba(25,85,190,.5)}
.logo .word{font-size:25px;font-weight:800;letter-spacing:-.6px;color:var(--brand-dd)}
.logo .word i{font-style:normal;color:var(--peach-d)}
.search{margin:14px 20px 0;height:50px;border-radius:16px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;font-size:16px;font-weight:600;color:#98A2B3;box-shadow:0 4px 16px rgba(20,55,130,.06)}
.hero{position:relative;margin:16px 20px 0;height:296px;border-radius:28px;overflow:hidden;
  background:radial-gradient(circle at 88% 8%,#6CC4FF 0%,rgba(108,196,255,0) 42%),linear-gradient(150deg,#3BA4F2 0%,var(--brand) 38%,#1550B5 100%);
  box-shadow:0 18px 34px -16px rgba(25,80,180,.6)}
.hero .ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.10)}
.hero-text{position:relative;z-index:3;padding:24px 22px 0}
.hero-tag{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:700;margin-bottom:12px}
.hero-title{color:#fff;font-size:25px;line-height:1.14;font-weight:800;letter-spacing:-.4px;width:300px}
.hero-sub{color:rgba(255,255,255,.88);font-size:15px;line-height:1.35;font-weight:600;width:150px;margin-top:10px}
.hero .play{margin-top:16px;display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 24px 0 26px;border-radius:23px;background:var(--peach);color:var(--ink);font-weight:800;font-size:17px;box-shadow:0 10px 18px -8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.hero-ill{position:absolute;left:0;top:0;z-index:2}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.cat{position:relative;height:98px;border-radius:20px;padding:13px 14px;overflow:hidden;font-size:15px;font-weight:800;line-height:1.2}
.cat svg{position:absolute;right:6px;bottom:4px}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:90px;background:#fff;display:flex;justify-content:space-around;padding-top:10px;box-shadow:0 -6px 24px rgba(20,40,80,.06);border-radius:26px 26px 0 0}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px;font-weight:700;color:#8F98A8;width:80px}
.tab.on{color:var(--brand)}

/* ---------- screen 2 ---------- */
.ill-card{margin:6px 20px 0;height:190px;border-radius:26px;overflow:hidden;box-shadow:0 12px 26px -16px rgba(25,70,160,.45)}
.h1{font-size:28px;font-weight:800;letter-spacing:-.5px;padding:0 20px;margin:18px 0 12px}
.rules{padding:0 20px;display:flex;flex-direction:column;gap:8px}
.rule{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:10px 14px 10px 10px;min-height:62px;box-shadow:0 3px 12px rgba(20,40,80,.04)}
.rule .ri{flex:none;width:44px;height:44px;border-radius:14px;background:var(--brand-l);display:flex;align-items:center;justify-content:center}
.rule .rt{font-size:16px;line-height:1.36;font-weight:600}
.rule.hl{background:var(--peach-l);box-shadow:inset 0 0 0 1.5px #FFCDA4}
.rule.hl .ri{background:#fff}
.rule .rt b{font-weight:800}
.s-rules .btn{position:absolute;left:20px;right:20px;bottom:40px}

/* ---------- screen 3/4 ---------- */
.stats{margin:2px 20px 0;background:#fff;border-radius:22px;padding:14px 14px 14px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 6px 18px rgba(20,55,130,.07)}
.stats .l{flex:1}
.stats .lab{font-size:17px;font-weight:800;margin-bottom:9px}
.bar{height:12px;border-radius:6px;background:#E3ECF8;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#4FB3F6,var(--brand))}
.bar:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),#fff calc(10% - 2px) 10%)}
.chip{flex:none;display:flex;align-items:center;gap:7px;height:46px;padding:0 14px 0 10px;border-radius:15px;background:var(--brand-l);color:var(--brand-dd);font-size:16px;font-weight:800}
.prize{margin:10px 20px 0;height:48px;border-radius:17px;display:flex;align-items:center;gap:10px;padding:0 14px 0 8px;font-size:16px;font-weight:800;
  background:linear-gradient(95deg,#FFE2C8 0%,#FFC796 60%,var(--peach) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.prize .gi{width:36px;height:36px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center}
.garden{position:relative;margin:12px 20px 0;height:238px;border-radius:26px;overflow:hidden;box-shadow:0 14px 28px -18px rgba(25,70,160,.5)}
.gsvg .rain{opacity:0}
.plot .pl{transform-box:fill-box;transform-origin:50% 100%;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.plot.st0 .pl{transform:scale(1)}
.plot .v-sprout,.plot .v-young,.plot .v-ripe{display:none}
.plot.st0 .v-sprout,.plot.st1 .v-young,.plot.st2 .v-ripe{display:inline}
.plot.st1 .pl{transform:scale(.8)}
.plot.st2 .pl{transform:scale(1)}
.plot .halo{opacity:0;transform-box:fill-box;transform-origin:50% 50%;transition:opacity .3s}
.plot.ripe .halo{opacity:1;animation:halo 1.6s ease-in-out infinite}
.plot .arrow{opacity:0;transition:opacity .25s}
.plot.ripe .arrow{opacity:1}
.plot.ripe .arrow use{transform-box:fill-box;animation:hop 1s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.94)}50%{transform:scale(1.06)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.hint{position:absolute;top:12px;right:12px;width:200px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.94);font-size:14px;line-height:1.3;font-weight:700;color:var(--brand-dd);box-shadow:0 6px 14px -8px rgba(15,45,110,.4)}
body.static *{animation:none!important;transition:none!important}
.s-game .btn,.s-end .btn.go{margin:12px 20px 0}
.prods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 20px}
.prod{background:#fff;border-radius:20px;padding:7px 7px 10px;box-shadow:0 4px 14px rgba(20,40,80,.05)}
.prod .pi{height:72px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.prod .pn{font-size:14px;line-height:1.3;font-weight:600;min-height:37px;margin:8px 3px 4px}
.prod .pp{display:flex;align-items:center;justify-content:space-between;padding:0 1px 0 3px}
.prod .pp b{font-size:17px;font-weight:800}
.plus{width:30px;height:30px;border-radius:10px;background:var(--brand);display:flex;align-items:center;justify-content:center}
.s-game .sec-h,.s-end .sec-h{margin-top:20px}

/* end screen */
.veil{position:absolute;left:0;right:0;top:104px;height:466px;z-index:20;
  background:rgba(243,248,255,.55);-webkit-backdrop-filter:blur(1px) saturate(.3);backdrop-filter:blur(1px) saturate(.3)}
.modal{position:absolute;left:34px;right:34px;top:210px;z-index:30;background:#fff;border-radius:28px;padding:24px 22px 22px;text-align:center;
  box-shadow:0 30px 60px -20px rgba(15,45,110,.45),0 0 0 1px rgba(0,0,0,.02)}
.modal .mi{width:76px;height:76px;margin:-62px auto 12px;border-radius:26px;background:linear-gradient(150deg,#FFD0A8,var(--peach));display:flex;align-items:center;justify-content:center;box-shadow:0 12px 22px -10px rgba(220,120,50,.7),0 0 0 6px #fff}
.modal .mt{font-size:23px;font-weight:800;letter-spacing:-.4px;margin-bottom:8px}
.modal .mb{font-size:17px;line-height:1.4;font-weight:600;color:#4E5566;min-height:48px}
.modal .btn{margin-top:18px;height:56px}

/* ---------- prototype layer ---------- */
#phone{zoom:var(--s,1)}
.screen{color:var(--ink)}   /* the app keeps its own ink in both page themes */
:where(.screen) button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
.screen button:focus-visible,.screen summary:focus-visible{outline:3px solid #F39A57;outline-offset:2px}
.screen .btn,.screen .play,.screen .cbtn,.screen .plus,.screen .cat,.screen .tab,.screen .row{transition:transform .12s ease,filter .12s ease}
.screen .btn:active,.screen .play:active,.screen .cbtn:active,.screen .plus:active,.screen .cat:active,.screen .row:active{transform:scale(.97)}
.screen .btn{width:350px;color:#fff}
.screen .cat{text-align:left;color:var(--ink);display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start}
.screen .tab{color:#8F98A8;position:relative}.screen .tab.on{color:var(--brand)}
.screen .search{cursor:pointer;width:350px}
.screen .hero{cursor:pointer}
.sec-h button{font-size:15px;font-weight:700;color:var(--brand)}
.overlay{position:absolute;inset:0;pointer-events:none;z-index:40}
.view{position:absolute;inset:0;background:var(--cream);overflow:hidden;visibility:hidden;will-change:transform}
.view.on{visibility:visible}
.view.root .nav [data-act="back"]{visibility:hidden}
.screen{--top:52px;touch-action:manipulation}
.sp{height:var(--top)}
.nav .ph{width:42px;height:42px}
.scroll{position:absolute;left:0;right:0;top:calc(var(--top) + 54px);bottom:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:28px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.has-tabs .scroll{bottom:90px}
.scroll.below-input{top:calc(var(--top) + 120px)}
.scroll > .sec-h:first-child,.scroll > .cats:first-child{margin-top:6px}

/* product grid (categories, search) */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.grid2 .prod{display:flex;flex-direction:column}
.grid2 .prod .pi{height:104px}
.grid2 .prod .pn{font-size:15px;min-height:40px}
.grid2 .pp{margin-top:auto}
.count{padding:0 20px;margin:2px 0 12px;font-size:15px;font-weight:600;color:var(--muted)}

/* badge on the cart tab */
.badge{position:absolute;top:-6px;left:calc(50% + 4px);min-width:24px;height:24px;border-radius:12px;padding:0 6px;background:var(--peach-d);color:#fff;font-size:14px;font-weight:800;line-height:20px;text-align:center;border:2px solid #fff;box-sizing:border-box}

/* cart */
.cart-row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 12px 10px 10px;margin:0 20px 8px;box-shadow:0 3px 12px rgba(20,40,80,.04)}
.cart-row .ci{width:66px;height:58px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center}
.cart-row .cx{flex:1;min-width:0}
.cart-row .cn{font-size:15px;font-weight:600;line-height:1.3}
.cart-row .cp{font-size:16px;font-weight:800;margin-top:4px}
.step{flex:none;display:flex;align-items:center;gap:6px;background:var(--brand-l);border-radius:12px;padding:4px}
.step button{width:30px;height:30px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--brand-dd)}
.step b{min-width:20px;text-align:center;font-size:16px}
.total{margin:14px 20px 0;padding:16px 18px;background:#fff;border-radius:20px;display:flex;flex-direction:column;gap:8px}
.total div{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);font-weight:600}
.total div.sum{font-size:19px;color:var(--ink);font-weight:800}
.scroll .btn.wide{margin:14px 20px 0}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 34px 0;gap:10px}
.empty .eic{width:96px;height:96px;border-radius:32px;background:var(--brand-l);display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.empty .et{font-size:21px;font-weight:800;letter-spacing:-.3px}
.empty .es{font-size:15px;color:var(--muted);line-height:1.45}
.empty .btn{margin-top:14px;width:260px}

/* search */
.input{position:absolute;left:20px;right:20px;top:calc(var(--top) + 58px);height:52px;border-radius:16px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 16px;box-shadow:0 4px 16px rgba(20,55,130,.06);border:2px solid var(--brand-l)}
.input:focus-within{border-color:var(--brand)}
.input input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:17px;font-weight:600;color:var(--ink)}
.input input::placeholder{color:#98A2B3}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px;margin-bottom:22px}
.chip2{height:40px;padding:0 16px;border-radius:20px;background:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;box-shadow:0 3px 10px rgba(20,40,80,.06)}
.nores{padding:30px 20px;text-align:center;font-size:16px;font-weight:600;color:var(--muted)}

/* notifications */
.ntf{display:flex;gap:12px;background:#fff;border-radius:20px;padding:14px;margin:0 20px 10px;width:350px;text-align:left;box-shadow:0 3px 12px rgba(20,40,80,.04)}
.ntf .ni{width:46px;height:46px;border-radius:15px;flex:none;display:flex;align-items:center;justify-content:center}
.ntf .nt{font-size:15px;font-weight:800;line-height:1.3}
.ntf .nb{font-size:14px;color:var(--muted);line-height:1.4;margin-top:3px}
.ntf .nd{font-size:14px;color:#98A2B3;margin-top:6px;font-weight:600}
.ntf.new .nt::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--peach-d);margin-left:6px;vertical-align:middle}

/* profile */
.pf-head{display:flex;align-items:center;gap:14px;padding:4px 20px 0}
.ava{width:60px;height:60px;border-radius:50%;background:linear-gradient(150deg,#6CC4FF,var(--brand));display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.pf-name{font-size:21px;font-weight:800;letter-spacing:-.3px}
.pf-sub{font-size:14px;color:var(--muted);font-weight:600;margin-top:2px}
.lcard{position:relative;margin:16px 20px 0;height:168px;border-radius:26px;padding:20px 22px;color:#fff;overflow:hidden;
  background:radial-gradient(circle at 90% 0%,#6CC4FF 0%,rgba(108,196,255,0) 45%),linear-gradient(150deg,#3BA4F2 0%,var(--brand) 45%,#1550B5 100%);box-shadow:0 16px 30px -16px rgba(25,80,180,.6)}
.lcard .lt{font-size:15px;font-weight:700;opacity:.9}
.lcard .lp{font-size:34px;font-weight:800;letter-spacing:-.8px;margin-top:6px}
.lcard .ls{font-size:14px;font-weight:600;opacity:.85}
.lcard .bc{position:absolute;right:20px;bottom:18px;background:#fff;border-radius:10px;padding:8px 10px}
.lcard .ring{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.12)}
.menu{margin:14px 20px 0;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 3px 12px rgba(20,40,80,.04)}
.menu .row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;font-size:16px;font-weight:700;border-bottom:1px solid var(--line);text-align:left}
.menu .row:last-child{border-bottom:0}
.menu .mi2{width:40px;height:40px;border-radius:13px;background:var(--brand-l);display:flex;align-items:center;justify-content:center;flex:none}
.menu .rs{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-top:2px}
.menu .chev{margin-left:auto;flex:none}

/* checkout */
.co-sec{margin:0 20px 18px}
#co-body{padding-top:8px}
.co-h{font-size:18px;font-weight:800;letter-spacing:-.2px;margin-bottom:10px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 3px 12px rgba(20,40,80,.05)}
.seg2 button{height:44px;border-radius:12px;font-size:16px;font-weight:800;color:var(--muted);text-align:center}
.seg2 button[aria-pressed="true"]{background:var(--brand);color:#fff}
.co-card{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;padding:14px;box-shadow:0 3px 12px rgba(20,40,80,.04)}
.co-card .ai{width:44px;height:44px;border-radius:14px;background:var(--brand-l);display:flex;align-items:center;justify-content:center;flex:none}
.co-card .at{font-size:16px;font-weight:800}
.co-card .as{font-size:14px;color:var(--muted);margin-top:3px;line-height:1.4;font-weight:600}
.co-sec .chips{padding:0;margin:0}
.chip2.on{background:var(--brand);color:#fff}
.co-sec .menu{margin:0}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid #C5CEDC;flex:none}
.radio.on{border:7px solid var(--brand)}
.co-sec + .total{margin-top:0}
.co-note{font-size:14px;color:var(--muted);text-align:center;margin:12px 34px 0;line-height:1.4;font-weight:600}
.done-wrap{position:absolute;left:0;right:0;top:var(--top);bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px 40px;gap:10px}
.done-wrap .ok{width:104px;height:104px;border-radius:50%;background:linear-gradient(150deg,#6CC4FF,var(--brand));display:flex;align-items:center;justify-content:center;box-shadow:0 18px 32px -14px rgba(25,80,180,.65);margin-bottom:10px}
.done-wrap .et{font-size:26px;font-weight:800;letter-spacing:-.5px}
.done-wrap .es{font-size:16px;color:var(--muted);font-weight:600;line-height:1.45}
.done-wrap .co-card{width:350px;text-align:left;margin:10px 0 6px}
.done-wrap .btn{margin-top:4px}
.screen .btn.ghost{background:#fff;color:var(--brand-dd);box-shadow:inset 0 0 0 2px var(--brand-l)}
.order{background:#fff;border-radius:20px;margin:0 20px 10px;padding:16px;box-shadow:0 3px 12px rgba(20,40,80,.04)}
.order .oh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:17px;font-weight:800}
.order .st{font-size:14px;font-weight:800;color:#1B7A3E;background:#E3F5E9;border-radius:8px;padding:3px 8px;flex:none}
.order .os{font-size:15px;color:var(--muted);margin-top:6px;line-height:1.4;font-weight:600}
.order .oi{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.order .oi span{width:46px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}

/* help */
.faq details{background:#fff;border-radius:20px;margin:0 20px 8px;padding:15px 16px;box-shadow:0 3px 12px rgba(20,40,80,.04)}
.faq summary{font-size:16px;font-weight:800;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;line-height:1.35}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:22px;line-height:20px;color:var(--brand);flex:none}
.faq details[open] summary::after{content:"−"}
.faq p{font-size:15px;line-height:1.5;color:#4E5566;margin-top:8px;font-weight:500}

/* address */
.addr{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:20px;padding:16px;margin:0 20px 10px;box-shadow:0 3px 12px rgba(20,40,80,.04)}
.addr .ai{width:44px;height:44px;border-radius:14px;background:var(--brand-l);display:flex;align-items:center;justify-content:center;flex:none}
.addr .at{font-size:16px;font-weight:800}
.addr .as{font-size:14px;color:var(--muted);margin-top:3px;line-height:1.4;font-weight:600}
.tag{display:inline-block;margin-top:8px;font-size:14px;font-weight:700;color:var(--brand-dd);background:var(--brand-l);border-radius:8px;padding:3px 8px}

/* watering */
.gsvg .can-a,.gsvg .bed-a,.gsvg .rd{transform-box:fill-box}
.gsvg .can-a{transform-origin:30% 75%}
.gsvg .bed-a{transform-origin:50% 100%}
.gsvg .drops-a{transition:opacity .2s}
.gsvg .rain{opacity:0}
.watering .gsvg .drops-a{opacity:0}
.watering .gsvg .rain{opacity:1}
.watering .gsvg .can-a{animation:pour 1.1s ease-in-out}
.watering .gsvg .rd{animation:fall .55s linear infinite}
.harvest .gsvg .bed-a{animation:boing .5s ease-out}
@keyframes pour{0%{transform:rotate(0)}25%,75%{transform:rotate(16deg)}100%{transform:rotate(0)}}
@keyframes fall{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(-4px,64px);opacity:0}}
@keyframes boing{0%{transform:scale(1,1)}40%{transform:scale(1.02,1.07)}100%{transform:scale(1,1)}}
.plus1{position:absolute;left:50%;top:34%;z-index:4;display:flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:20px;background:#fff;color:var(--brand-dd);font-size:18px;font-weight:800;box-shadow:0 10px 20px -8px rgba(15,45,110,.45);opacity:0;transform:translate(-50%,10px) scale(.6);pointer-events:none}
.harvest .plus1{animation:rise 1s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}25%{opacity:1;transform:translate(-50%,-6px) scale(1)}70%{opacity:1;transform:translate(-50%,-26px) scale(1)}100%{opacity:0;transform:translate(-50%,-44px) scale(1)}}
.bump{animation:bump .45s ease-out}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.bar i{transition:width .6s cubic-bezier(.2,.8,.2,1)}
.screen .btn[disabled],.screen .btn[aria-disabled="true"]{cursor:default;filter:saturate(.85)}

/* livelier garden */
.pick{position:absolute;width:88px;border-radius:22px;z-index:3;cursor:pointer}
.flyer{position:absolute;z-index:25;pointer-events:none}
.flyer svg{display:block}
.plot.nudge .pl{animation:wiggle .5s ease-in-out}
@keyframes wiggle{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.07) rotate(-6deg)}75%{transform:scale(1.07) rotate(6deg)}}
.hint{transition:background .3s}
.hint.flash{animation:flash .7s ease-in-out}
@keyframes flash{40%{background:#FFE9D6;transform:scale(1.04)}}

/* attempts are over */
.view .veil{top:calc(var(--top) + 52px)}
.view .modal{top:calc(var(--top) + 158px)}
.view .veil{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .35s ease,visibility 0s linear .35s}
.view .modal{opacity:0;pointer-events:none;visibility:hidden;transform:translateY(18px) scale(.96);transition:opacity .3s ease,transform .38s cubic-bezier(.2,.9,.25,1.2),visibility 0s linear .38s}
.view.spent .veil,.view.rewarded .veil{opacity:1;pointer-events:auto;visibility:inherit;transition-delay:0s}
.view.spent:not(.rewarded) .modal:not(.reward),.view.rewarded .modal.reward{opacity:1;pointer-events:auto;visibility:inherit;transform:none;transition-delay:0s}
.modal.reward .mi{background:linear-gradient(150deg,#FFE7B0,#FFC25E)}
.done-wrap .gift{text-align:center;line-height:1.35;font-size:15px;font-weight:800;color:#8A4A12;background:var(--peach-l);border-radius:12px;padding:8px 14px;margin-top:2px}
.screen .modal .btn{width:100%}

.toast{position:absolute;left:50%;bottom:112px;z-index:70;transform:translate(-50%,12px);opacity:0;pointer-events:none;max-width:320px;width:max-content;
  background:#1C2433;color:#fff;font-size:15px;font-weight:700;line-height:1.35;text-align:center;padding:12px 18px;border-radius:16px;box-shadow:0 12px 24px -10px rgba(0,0,0,.5);transition:opacity .2s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}

body.bare{background:var(--cream)}
body.bare .page{padding:0;align-items:flex-start;gap:0}
body.bare .phone{width:390px;height:auto;padding:0;border-radius:0;background:none;box-shadow:none}
body.bare .phone:before,body.bare .phone:after,body.bare .island,body.bare .status,body.bare .homebar{display:none}
body.bare .screen{--top:10px;border-radius:0;height:var(--h,844px)}
body.bare .screen button{-webkit-user-select:none;user-select:none}

@media (prefers-reduced-motion: reduce){
  .view{transition:none!important}
  .watering .gsvg .can-a,.watering .gsvg .rd,.harvest .gsvg .bed-a,.bump{animation:none}
  .harvest .plus1{animation:none;opacity:1;transform:translate(-50%,-26px)}
  .plot.ripe .halo,.plot.ripe .arrow use,.plot.nudge .pl,.hint.flash{animation:none}
  .view .modal,.view .veil,.bar i{transition:none}
}
</style>

  X: [72, 140, 210, 278], BASE: 196,
  PLOTS: ['carrot', 'cabbage', 'tomato', 'pumpkin'],
  /* [символ, ширина, высота, сколько уходит в землю]: подросший и созревший вид */
  /* fruit: что улетает в счетчик при сборе (только в прототипе) */
  TYPES: { carrot:  { young: ['carrot', 44, 62, 12],      ripe: ['carrotUp', 44, 72, 22], fruit: ['carrotUp', 34, 56] },
           cabbage: { young: ['cabbageYoung', 66, 55, 6], ripe: ['cabbage', 66, 55, 6],   fruit: ['cabbage', 52, 44] },
           tomato:  { young: ['tomatoYoung', 60, 75, 6],  ripe: ['tomato', 60, 75, 6],    fruit: ['p-tomato', 54, 42] },
           pumpkin: { young: ['pumpkinYoung', 66, 52, 6], ripe: ['pumpkin', 66, 52, 6],   fruit: ['pumpkin', 54, 42] } },
  RIPEN: [0, 2, 3, 1],                          // в каком порядке созревают лунки
  START: { hv: 2, tr: 3, stages: [1, 0, 1, 0], ripe: null, waters: 0 },

  HINT_RIPE: 'Нажмите на созревший овощ, чтобы собрать урожай'
};
function ripeOf(i) { const [sym, w, h, off] = GARDEN.TYPES[GARDEN.PLOTS[i]].ripe; return { sym, w, h, off }; }
function plotSVG(i, stage, ripe) {
  const [ys, yw, yh, yo] = GARDEN.TYPES[GARDEN.PLOTS[i]].young, t = ripeOf(i), r = Math.max(t.w, t.h) / 2 + 8;
  return `<g class="plot st${stage}${ripe ? ' ripe' : ''}" data-i="${i}" transform="translate(${GARDEN.X[i]} ${GARDEN.BASE})">
      <g class="pl"><circle class="halo" cx="0" cy="${-t.h / 2 + t.off}" r="${r}" fill="#FFF6D6" opacity=".8"/>
        <use class="v-sprout" href="#sprout" x="-15" y="-27" width="30" height="30"/>
        <use class="v-young" href="#${ys}" x="${-yw / 2}" y="${-yh + yo}" width="${yw}" height="${yh}"/>
        <use class="v-ripe" href="#${t.sym}" x="${-t.w / 2}" y="${-t.h + t.off}" width="${t.w}" height="${t.h}"/></g>
      <g class="arrow" transform="translate(-13 ${-t.h + t.off - 34})"><use href="#tapArrow" width="26" height="26"/></g></g>`;
}
function gardenHTML(st) {
  return `<svg class="gsvg" width="350" height="238" viewBox="0 0 350 238" aria-hidden="true">
      <use href="#sceneBg" width="350" height="238"/>
      <use href="#bedSoil" x="22" y="98" width="306" height="153"/>

      <use href="#bedBox" x="22" y="98" width="306" height="153"/>

        <use class="rd" href="#drop" x="130" y="74" width="12" height="12" style="animation-delay:0s"/>
        <use class="rd" href="#drop" x="146" y="80" width="10" height="10" style="animation-delay:.12s"/>

    <div class="hint" id="hint">${st.ripe == null ? GARDEN.HINT_IDLE : GARDEN.HINT_RIPE}</div>`;
}
/* шаг игры без анимации: полив делает одну лунку созревшей, остальные подрастают; сбор оставляет росток */
function gardenWater(st) {
  const k = GARDEN.RIPEN[st.waters % GARDEN.RIPEN.length];
  return { ...st, tr: st.tr - 1, waters: st.waters + 1, ripe: k,
           stages: st.stages.map((s, i) => i === k ? 2 : Math.min(1, s + 1)) };
}
function gardenHarvest(st) {
  return { ...st, hv: st.hv + 1, ripe: null, stages: st.stages.map((s, i) => i === st.ripe ? 0 : s) };
}

let gen = 0;   // растет при сбросе, чтобы таймеры прерванного полива не меняли новую игру
const SAVE_KEY = 'korzinka:' + (CFG.rule || 'k');
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ hv: state.hv, tr: state.tr, stages: state.stages, ripe: state.ripe,
    waters: state.waters, points: state.points, cart: state.cart, orders: state.orders, day: new Date().toDateString() })); } catch (e) {}
}
function load() {
  try {
    if (location.hash === '#reset') { localStorage.removeItem(SAVE_KEY); history.replaceState(null, '', location.pathname); return {}; }
    const d = JSON.parse(localStorage.getItem(SAVE_KEY)) || {};
    /* правило «неиспользованные попытки сгорают в 00:00»: в новый день старые попытки сгорают,
       при ежедневных попытках появляются 3 новые */
    if (CFG.game && d.day && d.day !== new Date().toDateString() && typeof d.tr === 'number') d.tr = CFG.mode === 'daily' ? 3 : 0;
    return d;
  } catch (e) { return {}; }
}
let stack = ['main'];

/* ---------- navigation ---------- */
const DUR = reduce ? 0 : 360;
function place(el, x, z, animate) {
  el.style.transition = animate && DUR ? `transform ${DUR}ms cubic-bezier(.22,.8,.24,1)` : 'none';
  el.style.transform = `translateX(${x}%)`;
  el.style.zIndex = z;
}
let navTimer, curView = null;
function show(id, dir) {
  const cur = curView, nxt = $('#v-' + id);
  nxt.classList.toggle('root', stack.length === 1);
  if (cur === nxt) return;
  curView = nxt;
  clearTimeout(navTimer);
  $$('.view').forEach(v => { if (v !== cur && v !== nxt) { v.classList.remove('on'); place(v, 0, 0, false); } });
  nxt.classList.add('on');
  if (!cur || dir === 'none' || !DUR) {
    place(nxt, 0, 2, false);
    if (cur) { cur.classList.remove('on'); place(cur, 0, 0, false); }
    return;
  }
  place(nxt, dir === 'fwd' ? 100 : -28, dir === 'fwd' ? 3 : 1, false);
  void nxt.offsetWidth;
  place(nxt, 0, dir === 'fwd' ? 3 : 1, true);
  place(cur, dir === 'fwd' ? -28 : 100, dir === 'fwd' ? 1 : 3, true);
  navTimer = setTimeout(() => { cur.classList.remove('on'); place(cur, 0, 0, false); nxt.style.zIndex = 2; }, DUR + 20);
}
function push(id) {
  const at = stack.indexOf(id);
  if (at === stack.length - 1) return;
  if (at >= 0) { stack = stack.slice(0, at + 1); show(id, 'back'); return; }
  stack.push(id); show(id, 'fwd');
}
function back() { if (placing || stack.length < 2) return; stack.pop(); show(stack[stack.length - 1], 'back'); }
function goRoot(id) { if (stack.length === 1 && stack[0] === id) return; stack = [id]; show(id, 'none'); }

/* ---------- toast ---------- */
let toastTimer;
function toast(text) {
  const t = $('#toast'); t.textContent = text; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1700);
}

/* ---------- game ---------- */
function paintCounters(bump) {
  if (!CFG.game) return;
  $('#hv').textContent = state.hv;
  $('#tr').textContent = state.tr;
  $('#pf-hv').textContent = state.hv;
  $('#hbar').style.width = state.hv * 10 + '%';
  if (bump && !reduce) ['#chip', '.stats .lab'].forEach(s => { const e = $(s); e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); });
}
function paintPoints() {
  $('#pf-pts').textContent = String(state.points).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0') + ' ' + plural(state.points, 'балл', 'балла', 'баллов');
}
function setReward(on) {
  if (!CFG.game) return;
  game.classList.toggle('rewarded', on);
  $('#reward').inert = !on;
  game.querySelector('.veil').inert = !(on || game.classList.contains('spent'));
  if (on) $('#reward button').focus({ preventScroll: true });
}
function rewardOk() {
  state.points += 500; state.hv = 0;
  paintCounters(false); paintPoints(); setReward(false); save();
  if (state.tr === 0) setSpent(true);
}
function setSpent(on) {
  if (!CFG.game) return;
  game.classList.toggle('spent', on);
  const veil = game.querySelector('.veil'), modal = game.querySelector('.modal:not(.reward)');
  modal.inert = !on; veil.inert = !(on || game.classList.contains('rewarded'));
  waterBtn.disabled = on;
  if (on && (document.activeElement === waterBtn || document.activeElement === document.body)) modal.querySelector('button').focus({ preventScroll: true });
}
function paintGarden() {
  if (!CFG.game) return;
  $$('#garden .plot').forEach(g => g.setAttribute('class', `plot st${state.stages[+g.dataset.i]}${state.ripe === +g.dataset.i ? ' ripe' : ''}`));
  $('#hint').textContent = state.ripe == null ? GARDEN.HINT_IDLE : GARDEN.HINT_RIPE;
  const pick = $('#garden .pick');
  if (state.ripe == null) { pick.hidden = true; return; }
  const t = ripeOf(state.ripe);
  pick.hidden = false;
  pick.style.left = (GARDEN.X[state.ripe] - 44) + 'px';
  pick.style.top = (GARDEN.BASE - t.h + t.off - 40) + 'px';
  pick.style.height = (t.h + 40) + 'px';
}
function nudge() {
  const r = $(`#garden .plot[data-i="${state.ripe}"]`), h = $('#hint');
  [r, h].forEach(e => { e.classList.remove('nudge', 'flash'); void e.getBoundingClientRect(); });
  r.classList.add('nudge'); h.classList.add('flash');
}
function fly(i) {
  if (reduce) return;
  const t = ripeOf(i), [fs, fw, fh] = GARDEN.TYPES[GARDEN.PLOTS[i]].fruit, stats = $('#v-game .stats');
  const x0 = garden.offsetLeft + GARDEN.X[i] - fw / 2, y0 = garden.offsetTop + GARDEN.BASE - t.h + t.off + (t.h - fh) / 2;
  const dx = stats.offsetLeft + 30 - x0, dy = stats.offsetTop + 4 - y0;
  const el = document.createElement('div');
  el.className = 'flyer'; el.innerHTML = u(fs, fw, fh);
  el.style.left = x0 + 'px'; el.style.top = y0 + 'px';
  game.appendChild(el);
  el.animate([
    { transform: 'translate(0,0) scale(1)', opacity: 1 },
    { transform: `translate(${dx * .45}px, ${dy * .45 - 40}px) scale(.85)`, opacity: 1, offset: .45 },
    { transform: `translate(${dx}px, ${dy}px) scale(.35)`, opacity: .15 }
  ], { duration: 680, easing: 'cubic-bezier(.45,0,.55,1)' }).onfinish = () => el.remove();
}
function water() {
  if (!CFG.game || state.busy || state.harvesting) return;
  if (state.ripe != null) { nudge(); return; }
  if (state.tr <= 0) return;
  const kb = document.activeElement === waterBtn;
  state.busy = true; waterBtn.setAttribute('aria-disabled', 'true');
  const next = gardenWater(state);
  state.tr = next.tr; paintCounters(true);
  garden.classList.add('watering');
  const g = gen;
  setTimeout(() => {
    if (g !== gen) return;
    state.waters = next.waters; state.ripe = next.ripe; state.stages = next.stages;
    paintGarden(); save();
  }, reduce ? 0 : 650);
  setTimeout(() => {
    if (g !== gen) return;
    garden.classList.remove('watering');
    state.busy = false; waterBtn.removeAttribute('aria-disabled');
    if (kb && state.ripe != null) $('#garden .pick').focus({ preventScroll: true });
  }, reduce ? 0 : 1150);
}
function harvest() {
  if (!CFG.game || state.harvesting || state.ripe == null) return;
  const kb = document.activeElement === $('#garden .pick');
  const i = state.ripe, t = ripeOf(i), next = gardenHarvest(state);
  state.harvesting = true;
  fly(i);
  const p1 = $('#garden .plus1');
  const [fs] = GARDEN.TYPES[GARDEN.PLOTS[i]].fruit;
  p1.innerHTML = u(fs, 28, 24) + '+1';
  p1.style.left = GARDEN.X[i] + 'px'; p1.style.top = (GARDEN.BASE - t.h + t.off - 6) + 'px';
  garden.classList.remove('harvest'); void garden.offsetWidth; garden.classList.add('harvest');
  state.ripe = null; state.stages = next.stages; paintGarden();
  const g = gen;
  setTimeout(() => {
    if (g !== gen) return;
    state.hv = next.hv; paintCounters(true); state.harvesting = false; save();
    if (state.hv >= 10) setTimeout(() => { if (g === gen) setReward(true); }, reduce ? 0 : 350);
    else if (state.tr === 0) setTimeout(() => { if (g === gen) setSpent(true); }, reduce ? 0 : 350);
    else if (kb) waterBtn.focus({ preventScroll: true });
  }, reduce ? 0 : 680);
  setTimeout(() => { if (g === gen) garden.classList.remove('harvest'); }, 1100);
}
function resetGame() {
  gen += 1;
  if (!CFG.game) return;
  Object.assign(state, copyStart(), { busy: false, harvesting: false });
  setReward(false);
  garden.classList.remove('watering', 'harvest');
  game.querySelectorAll('.flyer').forEach(e => e.remove());
  waterBtn.removeAttribute('aria-disabled');
  paintCounters(false); paintGarden(); setSpent(false);
}

/* ---------- catalog, search, cart ---------- */
function openCategory(id) {
  const c = CATS.find(x => x.id === id); if (!c) return;
  openList(c.name, PRODUCTS.filter(p => p.cat === id));
}
function openList(title, list) {
  $('#cat-t').textContent = title;
  const body = $('#cat-body');
  body.innerHTML = `<div class="count">${list.length} ${plural(list.length, 'товар', 'товара', 'товаров')}</div>${grid(list)}`;
  body.scrollTop = 0;

}
function plural(n, one, few, many) {
  const a = n % 10, b = n % 100;
  return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 12 || b > 14) ? few : many;
}
const norm = s => plain(s).toLowerCase().replace(/ё/g, 'е').trim();
function renderSearch() {
  const q = norm($('#q').value), body = $('#search-body');
  if (!q) {
    body.innerHTML = `<div class="sec-h"><b>Часто ищут</b></div>
      <div class="chips">${['Яблоки', 'Молоко', 'Хлеб', 'Шампунь', 'Корм для кошек'].map(t => `<button type="button" class="chip2" data-act="chip" data-q="${t}">${t}</button>`).join('')}</div>
      <div class="sec-h"><b>Подборка недели</b></div>${picks()}`;
    return;
  }
  const found = PRODUCTS.filter(p => norm(p.name).includes(q) || norm(CATS.find(c => c.id === p.cat).name).includes(q));
  body.innerHTML = found.length
    ? `<div class="count">Нашлось ${found.length} ${plural(found.length, 'товар', 'товара', 'товаров')}</div>${grid(found)}`

}
function openSearch(text = '') {
  const input = $('#q'); input.value = text; renderSearch(); $('#search-body').scrollTop = 0;
  push('search');
  setTimeout(() => { try { input.focus({ preventScroll: true }); } catch (e) {} }, DUR + 30);
}
function cartCount() { return Object.values(state.cart).reduce((a, b) => a + b, 0); }
function paintBadges() {
  const n = cartCount();
  $$('.tab .badge').forEach(b => { b.hidden = n === 0; b.textContent = n > 99 ? '99+' : n; });
}
function renderCart() {
  const items = cartItems();

  if (!items.length) {
    body.innerHTML = `<div class="empty"><div class="eic">${u('t-cart',48,48,'style="color:#1E6BD6"')}</div><div class="et">В корзине пока пусто</div><div class="es">Добавляйте товары кнопкой «+» в каталоге и в подборках</div><button type="button" class="btn" data-act="tab-catalog">Перейти в каталог</button></div>`;
    return;
  }
  const sum = items.reduce((a, { p, q }) => a + p.price * q, 0), n = cartCount();

      <div class="step"><button type="button" data-act="dec" data-id="${p.id}" aria-label="Убрать одну штуку: ${p.name}">${u('i-minus',18,18)}</button><b>${q}</b><button type="button" data-act="inc" data-id="${p.id}" aria-label="Добавить еще одну: ${p.name}">${u('i-plusd',18,18)}</button></div></div>`).join('')
    + `<div class="total"><div><span>Товары, ${n} шт.</span><span>${rub(sum)}</span></div><div><span>Доставка</span><span>Бесплатно</span></div><div class="sum"><span>Итого</span><span>${rub(sum)}</span></div></div>
       <button type="button" class="btn wide" data-act="checkout">Оформить заказ</button>`;
}
const cartItems = () => Object.entries(state.cart).filter(([, q]) => q > 0).map(([id, q]) => ({ p: BY_ID[id], q }));
const SLOTS = { delivery: ['Сегодня, 18:00–19:00', 'Сегодня, 20:00–21:00', 'Завтра, 10:00–11:00'],
                pickup:   ['Через час', 'Сегодня к 19:00', 'Завтра к 10:00'] };
const PAYS = ['Картой при получении', 'Наличными при получении', 'По QR-коду при получении'];
const PLACE = { delivery: ['ул. Лесная, 8, кв. 14', 'Курьер позвонит за 15 минут'],
                pickup:   ['Магазин у дома', 'ул. Садовая, 12 · с 8:00 до 23:00'] };
function renderCheckout() {

    <div class="total"><div><span>Товары, ${n}\u00a0шт.</span><span>${rub(sum)}</span></div><div><span>${co.mode === 'delivery' ? 'Доставка' : 'Самовывоз'}</span><span>Бесплатно</span></div><div class="sum"><span>Итого</span><span>${rub(sum)}</span></div></div>
    <button type="button" class="btn wide" data-act="co-confirm" id="co-confirm">Подтвердить заказ</button>
    <p class="co-note">Оплата при получении. Заказ можно отменить в «Моих заказах», пока его не начали собирать.</p>`;

let placing = false;
function confirmOrder(btn) {
  if (placing || !cartCount()) return;
  placing = true; btn.disabled = true; btn.textContent = 'Оформляем…';
  const items = cartItems(), co = state.co;
  const order = { no: 4821 + state.orders.length, items: items.map(({ p, q }) => [p.id, q]),
    n: cartCount(), sum: items.reduce((a, { p, q }) => a + p.price * q, 0),
    mode: co.mode, slot: SLOTS[co.mode][co.slot], pay: PAYS[co.pay] };
  setTimeout(() => {
    placing = false;
    state.orders.unshift(order);
    const bonus = CFG.game && CFG.mode === 'purchase' && order.sum >= 800;
    if (bonus) { state.tr += 3; paintCounters(false); setSpent(false); }
    state.cart = {}; paintBadges(); renderCart(); save();
    $('#done-body').innerHTML = `<div class="ok">${u('i-check',52,52)}</div>
      <div class="et">Заказ оформлен!</div>
      <div class="es">Номер заказа №\u00a0${order.no}</div>
      <div class="co-card"><span class="ai">${u('i-clock2',22,22)}</span><div><div class="at">${order.slot}</div><div class="as">${order.mode === 'delivery' ? 'Доставка: ' + PLACE.delivery[0] : 'Самовывоз: ' + PLACE.pickup[1].split(' · ')[0]}<br>${order.pay}</div></div></div>
      ${bonus ? '<div class="gift">Вам начислено 3\u00a0попытки<br>в игре «Огород\u00a0Корзинки»</div><button type="button" class="btn" data-act="garden-root">Вернуться в игру</button>' : ''}
      <button type="button" class="btn${bonus ? ' ghost' : ''}" data-act="my-orders">Мои заказы</button>
      <button type="button" class="btn ghost" data-act="tab-main">На главную</button>`;
    stack = ['done']; show('done', 'fwd');
  }, reduce ? 0 : 900);
}
function renderOrders() {

function addToCart(id, d = 1) {

  if ($('#v-cart').classList.contains('on')) renderCart();
}

/* ---------- fit the phone to the window ---------- */
function fit() {
  const phone = $('#phone');
  const bare = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true
    || (innerWidth <= 520 && matchMedia('(pointer: coarse)').matches);
  document.body.classList.toggle('bare', bare);
  if (bare) {
    const z = Math.min(innerWidth / 390, innerHeight / 804);
    phone.style.setProperty('--s', z.toFixed(4));
    screenEl.style.setProperty('--h', (innerHeight / z).toFixed(1) + 'px');
    return;
  }
  screenEl.style.removeProperty('--h');
  const s = Math.min((innerWidth - 32) / 414, (innerHeight - 48) / 868, 1.15);
  phone.style.setProperty('--s', Math.max(s, .45).toFixed(3));
}
addEventListener('resize', fit);

/* ---------- boot ---------- */
function start(data) {
  applyTexts();
  if (typeof data.hv === 'number') { state.hv = data.hv; state.tr = data.tr; }
  if (Array.isArray(data.stages) && data.stages.length === START.stages.length) { state.stages = [...data.stages]; state.ripe = data.ripe ?? null; state.waters = data.waters || 0; }
  if (data.cart && typeof data.cart === 'object') state.cart = { ...data.cart };
  if (typeof data.points === 'number') state.points = data.points;
  if (Array.isArray(data.orders)) state.orders = data.orders.filter(o => o && Array.isArray(o.items));
  paintCounters(false); paintGarden(); paintPoints(); setReward(false); setSpent(state.tr === 0 && state.ripe == null); paintBadges(); renderCart(); renderSearch(); renderOrders();
  const known = Array.isArray(data.stack) ? data.stack.filter(id => VIEW_KEYS.includes(id) && !['category', 'checkout', 'done'].includes(id)) : [];
  stack = known.length ? known : ['main'];
  show(stack[stack.length - 1], 'none');
  fit();
}
addEventListener('hashchange', () => {
  if (location.hash !== '#reset') return;

});
window.claude?.hot?.snapshot?.(() => ({ points: state.points, hv: state.hv, tr: state.tr, stages: [...state.stages], ripe: state.ripe, waters: state.waters, cart: { ...state.cart }, orders: state.orders, stack: [...stack] }));
